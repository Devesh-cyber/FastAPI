<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pincode Lookup</title>
<style>
  :root {
    --ink: #1c2530;
    --paper: #f6f3ee;
    --line: #d8d2c4;
    --stamp: #b5472b;
    --stamp-dark: #8f371f;
    --ok: #2f6f4e;
    --panel: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Courier New', Courier, monospace;
    background-image:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size: 22px 22px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
    border-bottom: 3px double var(--ink);
    padding-bottom: 16px;
  }

  .stamp {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border: 3px solid var(--stamp);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--stamp);
    font-weight: bold;
    font-size: 11px;
    text-align: center;
    line-height: 1.1;
    transform: rotate(-8deg);
    letter-spacing: 0.5px;
  }

  h1 {
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0;
  }

  .sub {
    font-size: 12px;
    color: #6b6558;
    margin-top: 4px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
  }

  .card::before {
    content: attr(data-tag);
    position: absolute;
    top: -11px;
    left: 20px;
    background: var(--paper);
    padding: 0 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--stamp);
    text-transform: uppercase;
  }

  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: #6b6558;
  }

  input[type="text"], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
  }

  textarea { resize: vertical; min-height: 80px; }

  .row { display: flex; gap: 10px; margin-top: 14px; }

  button {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--stamp);
    color: #fff;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
  }

  button:hover { background: var(--stamp-dark); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .result {
    margin-top: 16px;
    border-top: 1px dashed var(--line);
    padding-top: 14px;
    font-size: 14px;
  }

  .result .row-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
  }

  .result .row-item span:first-child { color: #6b6558; }

  .error-box {
    margin-top: 16px;
    border: 1px solid var(--stamp);
    background: #fbeee9;
    color: var(--stamp-dark);
    padding: 10px 12px;
    font-size: 13px;
  }

  .entry {
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-top: 8px;
  }

  .entry.miss { border-color: var(--stamp); background: #fbeee9; }
  .entry .code { font-weight: bold; }
  .entry .ok-tag { color: var(--ok); font-size: 11px; text-transform: uppercase; }
  .entry .miss-tag { color: var(--stamp); font-size: 11px; text-transform: uppercase; }

  .base-url {
    font-size: 11px;
    color: #6b6558;
    margin-top: -28px;
    margin-bottom: 32px;
    text-align: right;
  }

  .base-url input {
    font-family: inherit;
    font-size: 11px;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    width: 200px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="stamp">PIN<br>CODE</div>
    <div>
      <h1>Pincode Lookup</h1>
      <div class="sub">City &amp; state, by post code</div>
    </div>
  </header>

  <div class="base-url">
    API base: <input type="text" id="baseUrl" value="http://127.0.0.1:8000">
  </div>

  <!-- Single lookup -->
  <div class="card" data-tag="Single">
    <label for="singleInput">6-digit pincode</label>
    <div class="row">
      <input type="text" id="singleInput" placeholder="e.g. 400001" maxlength="6">
      <button id="singleBtn">Look up</button>
    </div>
    <div id="singleResult"></div>
  </div>

  <!-- Bulk lookup -->
  <div class="card" data-tag="Bulk (max 20)">
    <label for="bulkInput">Pincodes, one per line or comma-separated</label>
    <textarea id="bulkInput" placeholder="400001, 110001, 560001"></textarea>
    <div class="row">
      <button id="bulkBtn">Look up all</button>
    </div>
    <div id="bulkResult"></div>
  </div>

</div>

<script>
  const baseUrlInput = document.getElementById('baseUrl');

  function apiBase() {
    return baseUrlInput.value.replace(/\/$/, '');
  }

  // ---- Single lookup ----
  const singleInput = document.getElementById('singleInput');
  const singleBtn = document.getElementById('singleBtn');
  const singleResult = document.getElementById('singleResult');

  async function runSingle() {
    const code = singleInput.value.trim();
    singleResult.innerHTML = '';
    if (!/^\d{6}$/.test(code)) {
      singleResult.innerHTML = `<div class="error-box">Enter exactly 6 digits.</div>`;
      return;
    }
    singleBtn.disabled = true;
    singleBtn.textContent = 'Looking up…';
    try {
      const res = await fetch(`${apiBase()}/pincode/${code}`);
      const data = await res.json();
      if (!res.ok) {
        singleResult.innerHTML = `<div class="error-box">${data.message || data.detail || 'Lookup failed'}</div>`;
      } else {
        singleResult.innerHTML = `
          <div class="result">
            <div class="row-item"><span>City</span><span>${data.city}</span></div>
            <div class="row-item"><span>District</span><span>${data.district}</span></div>
            <div class="row-item"><span>State</span><span>${data.state}</span></div>
          </div>`;
      }
    } catch (err) {
      singleResult.innerHTML = `<div class="error-box">Could not reach the API. Check the base URL and CORS settings.</div>`;
    } finally {
      singleBtn.disabled = false;
      singleBtn.textContent = 'Look up';
    }
  }

  singleBtn.addEventListener('click', runSingle);
  singleInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSingle(); });

  // ---- Bulk lookup ----
  const bulkInput = document.getElementById('bulkInput');
  const bulkBtn = document.getElementById('bulkBtn');
  const bulkResult = document.getElementById('bulkResult');

  async function runBulk() {
    const codes = bulkInput.value
      .split(/[\n,]/)
      .map(c => c.trim())
      .filter(Boolean);

    bulkResult.innerHTML = '';
    if (codes.length === 0) {
      bulkResult.innerHTML = `<div class="error-box">Enter at least one pincode.</div>`;
      return;
    }
    if (codes.length > 20) {
      bulkResult.innerHTML = `<div class="error-box">Maximum 20 pincodes per request.</div>`;
      return;
    }

    bulkBtn.disabled = true;
    bulkBtn.textContent = 'Looking up…';
    try {
      const res = await fetch(`${apiBase()}/pincode/bulk`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pincodes: codes })
      });
      const data = await res.json();
      if (!res.ok) {
        const msg = Array.isArray(data.detail)
          ? data.detail.map(d => d.msg).join('; ')
          : (data.message || data.detail || 'Lookup failed');
        bulkResult.innerHTML = `<div class="error-box">${msg}</div>`;
        return;
      }

      let html = `<div class="result">
        <div class="row-item"><span>Found</span><span>${data.found}</span></div>
        <div class="row-item"><span>Not found</span><span>${data.not_found}</span></div>
      </div>`;

      data.result.forEach(loc => {
        html += `<div class="entry">
          <div class="code">${loc.pincode} <span class="ok-tag">found</span></div>
          <div>${loc.city}, ${loc.district}, ${loc.state}</div>
        </div>`;
      });

      data.missing.forEach(code => {
        html += `<div class="entry miss">
          <div class="code">${code} <span class="miss-tag">not found</span></div>
        </div>`;
      });

      bulkResult.innerHTML = html;
    } catch (err) {
      bulkResult.innerHTML = `<div class="error-box">Could not reach the API. Check the base URL and CORS settings.</div>`;
    } finally {
      bulkBtn.disabled = false;
      bulkBtn.textContent = 'Look up all';
    }
  }

  bulkBtn.addEventListener('click', runBulk);
</script>

</body>
</html>
